name: rsprojects_showcase
description: Public portal for all RSProjects products.
publish_to: "none"

version: 0.0.1+1

environment:
  sdk: ^3.12.2

# Add packages only when a feature requires them.
# Prefer cross-platform packages (Web + Android + iOS + macOS + Windows + Linux).
# (next candidates: flutter_riverpod, markdown).
dependencies:
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.1
  go_router: ^17.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # TODO(deps): integration_test when end-to-end flows are implemented
  # integration_test:
  #   sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/generated/registry.json
    # - assets/branding/
    # - assets/icons/
    # - assets/images/
    # - assets/screenshots/
